<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPAP Room Guide</title>
    <link rel="icon" type="image/png" href="images/nyu-logo.png">
    <link rel="apple-touch-icon" href="images/nyu-logo.png">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="js/background.js?v=4"></script>
    <script src="js/lightbox.js"></script>
</head>
<body data-hide-credentials="true">
    <div class="container">
        <header>
            <div class="header-content">
                <img src="images/nyu-logo.svg" alt="NYU Logo" class="nyu-logo">
                <h1>MPAP Room Guides</h1>
            </div>
        </header>
        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Room List
        </a>
        <main>
            <h1>Room 620 (Ensemble Room)</h1>
            <section class="step" id="paulson-620-steps">
                <div class="mode-content" style="width: 100%; display: block;">
                    <h2 style="margin-bottom: 20px;">Room 620 Video Guide</h2>
                    <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; margin: 20px 0; border-radius: 8px;">
                        <iframe 
                            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;" 
                            src="https://www.youtube.com/embed/ayf1sYiNLhQ" 
                            allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                        </iframe>
                    </div>
                    <p style="margin-top: 20px; color: #666; font-size: 0.9em;">Watch the video above for instructions on using Room 620.</p>
                </div>
            </section>
        </main>
    </div>
    <script>
        // Step navigation (single section)
        function nextStep(sectionId) {
            const container = document.querySelector(`[data-section="${sectionId}"]`);
            const current = container.querySelector('.instruction-step.active');
            const num = parseInt(current.dataset.step);
            const total = container.querySelectorAll('.instruction-step').length;
            if (num < total) {
                current.classList.remove('active');
                const nxt = container.querySelector(`[data-step="${num + 1}"]`);
                nxt.classList.add('active');
                updateStepCounter(container, num + 1, total);
                updateNavigationButtons(container, num + 1, total);
            }
        }
        function previousStep(sectionId) {
            const container = document.querySelector(`[data-section="${sectionId}"]`);
            const current = container.querySelector('.instruction-step.active');
            const num = parseInt(current.dataset.step);
            const total = container.querySelectorAll('.instruction-step').length;
            if (num > 1) {
                current.classList.remove('active');
                const prv = container.querySelector(`[data-step="${num - 1}"]`);
                prv.classList.add('active');
                updateStepCounter(container, num - 1, total);
                updateNavigationButtons(container, num - 1, total);
            }
        }
        function updateStepCounter(container, current, total) {
            container.querySelectorAll('.step-dot').forEach((dot, idx) => {
                dot.classList.toggle('active', idx === current - 1);
            });
        }
        function updateNavigationButtons(container, current, total) {
            const prevBtn = container.querySelector('.prev-btn');
            const nextBtn = container.querySelector('.next-btn');
            if (prevBtn) prevBtn.disabled = current === 1;
            if (nextBtn) {
                if (current === total) {
                    nextBtn.innerHTML = '<i class="fas fa-check"></i>';
                    nextBtn.disabled = true;
                } else {
                    nextBtn.innerHTML = '<i class="fas fa-chevron-right"></i>';
                    nextBtn.disabled = false;
                }
            }
        }
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.step-dot').forEach(dot => {
                dot.addEventListener('click', function() {
                    const target = parseInt(this.dataset.step);
                    const container = this.closest('[data-section]');
                    const total = container.querySelectorAll('.instruction-step').length;
                    container.querySelectorAll('.instruction-step').forEach(s => s.classList.remove('active'));
                    const step = container.querySelector(`[data-step="${target}"]`);
                    if (step) step.classList.add('active');
                    updateStepCounter(container, target, total);
                    updateNavigationButtons(container, target, total);
                });
            });
        });
    </script>
</body>
</html>
